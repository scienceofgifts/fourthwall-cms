#:schema node_modules/wrangler/config-schema.json
name = "fourthwall-cms"
main = "workers.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[images]
binding = "IMAGES"

[vars]
R2_PUBLIC_BASE_URL = "https://images.scienceofgifts.com"

# Optional Cloudflare R2 Bucket binding for direct Worker uploads:
# If using a native Worker R2 bucket binding instead of S3 API credentials,
# uncomment the block below and set `bucket_name` to match your configured R2_BUCKET_NAME:
# [[r2_buckets]]
# binding = "IMAGES_BUCKET"
# bucket_name = "<YOUR_R2_BUCKET_NAME>"
