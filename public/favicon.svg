<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182538"/>
      <stop offset="100%" stop-color="#111A27"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E198"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FA"/>
      <stop offset="100%" stop-color="#DFEEF5"/>
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.25" fill="none" stroke="#2C3E58" stroke-width="1.5"/>

  <!-- Gift Box Body -->
  <rect x="7" y="14" width="18" height="12" rx="2" fill="url(#box)"/>

  <!-- Gift Box Lid -->
  <rect x="5.5" y="11" width="21" height="4.5" rx="1.5" fill="#CDE2EE"/>

  <!-- Vertical Ribbon -->
  <rect x="14.5" y="11" width="3" height="15" fill="url(#gold)"/>

  <!-- Horizontal Ribbon on Lid -->
  <rect x="5.5" y="12.5" width="21" height="1.5" fill="url(#gold)" opacity="0.35"/>

  <!-- Ribbon Bow -->
  <!-- Left loop -->
  <path d="M16 11.5 C14 8 10 7.5 10.5 9.5 C11 11.5 14.5 11.5 16 11.5 Z" fill="url(#gold)"/>
  <!-- Right loop -->
  <path d="M16 11.5 C18 8 22 7.5 21.5 9.5 C21 11.5 17.5 11.5 16 11.5 Z" fill="url(#gold)"/>
  <!-- Center Knot -->
  <circle cx="16" cy="11.5" r="1.5" fill="#F8E8A2"/>

  <!-- Small Science/Star Sparkle in Top Right -->
  <path d="M24 4.5 L24.6 6 L26.1 6.6 L24.6 7.2 L24 8.7 L23.4 7.2 L21.9 6.6 L23.4 6 Z" fill="#F8E8A2"/>
</svg>
